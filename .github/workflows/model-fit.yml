name: Model-fit self-test controls
on:
  pull_request:
    paths: ['model-fit/**', '.github/workflows/model-fit.yml']
  push:
    branches: [main]
    paths: ['model-fit/**', '.github/workflows/model-fit.yml']
permissions:
  contents: read
jobs:
  controls:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r model-fit/requirements-online.txt
      - run: python -m unittest discover -s model-fit/tests -v
